<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SquadSync settings</title>
  <style>
    body {
      background: #0a0a0a;
      color: #ededed;
      font-family: -apple-system, system-ui, sans-serif;
      padding: 24px;
      max-width: 480px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #a1a1a1;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      height: 32px;
      background: #111111;
      border: 1px solid #262626;
      border-radius: 6px;
      color: #ededed;
      padding: 0 8px;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    button {
      height: 32px;
      padding: 0 16px;
      background: #ededed;
      color: #0a0a0a;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #3fb950;
      display: none;
    }
  </style>
</head>
<body>
  <h3>SquadSync settings</h3>
  <label for="appUrl">Deployed app URL</label>
  <input id="appUrl" type="text" placeholder="https://hack-nova-squad-sync.vercel.app" />
  <label for="deadline">Default deadline (optional)</label>
  <input id="deadline" type="date" />
  <button id="save">Save</button>
  <div id="status">Saved.</div>
  <script src="options.js"></script>
</body>
</html>
